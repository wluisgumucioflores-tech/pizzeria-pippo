server:
  # NestJS backend = 3333, frontend = 3000 → orchestrator = 8090
  port: 8090

spring:
  application:
    name: ai-orchestrator
  messages:
    # Without this, an "es" request can silently fall back to the host's OS locale instead of messages.properties.
    fallback-to-system-locale: false
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      init:
        # Don't auto-pull: the model is already in Ollama.
        pull-model-strategy: never
      chat:
        options:
          # Startup default; every request overrides it via runtime-config.
          model: ${DEFAULT_OLLAMA_MODEL:qwen3:8b}

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Server-to-server config for calling NestJS directly (not through services/mcp-saas).
backend:
  url: ${BACKEND_URL:http://localhost:3333}
  internal-token: ${PIPPO_INTERNAL_TOKEN:dev-internal-token}
  # In-process cache TTL for RuntimeConfigClient/SystemPromptClient.
  cache-ttl: ${BACKEND_CACHE_TTL:30s}

# Defaults for /chat/tools requests that omit something (see config/ChatDefaults.java).
chat:
  default-locale: es
  default-role: admin
  # Bolivia is fixed UTC-4, no DST.
  timezone-offset: "-04:00"

# Backend endpoint paths used by @Tool classes (see config/ToolPaths.java).
tools:
  paths:
    sales-report: /reports/sales
    top-products-report: /reports/top-products
    daily-report: /reports/daily
    cashiers-report: /reports/cashiers
    orders-report: /reports/orders
    stock: /stock
    stock-alerts: /stock/alerts
    stock-movements: /stock/movements
    stock-purchase: /stock/purchase
    stock-adjust: /stock/adjust
    promotions: /promotions
    products: /products
    categories: /categories
    branches: /branches
    ingredients: /ingredients
    variant-types: /variant-types

# Applies to every auto-configured RestClient.Builder — avoids a hung NestJS call blocking forever.
spring.http.client:
  connect-timeout: 5s
  read-timeout: 20s
